<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Farm</title>
        <link rel="stylesheet" href="./stylesheets/main.css" />
    </head>
    <body>
        <div id="app">
            <header id="topPanel">
                <div class="resourceBar">
                    <div class="resourceItem">
                        <label for="currentMoneyDisplay">Current Money</label>
                        <div id="currentMoneyDisplay" class="resourceAmount">
                            100
                        </div>
                    </div>
                    <div class="resourceItem">
                        <label for="currentEggDisplay">Current Eggs</label>
                        <div id="currentEggDisplay" class="resourceAmount">
                            16
                        </div>
                    </div>
                    <div class="resourceItem">
                        <label for="currentStickDisplay">Current Sticks</label>
                        <div id="currentStickDisplay" class="resourceAmount">
                            20
                        </div>
                    </div>
                </div>
            </header>
            <aside id="toolPanel"></aside>
            <main id="canvasPanel">
                <canvas id="gameCanvas"></canvas>
            </main>
            <aside id="propertiesPanel">
                <p id="mouseX">mouseX:</p>
                <p id="mouseY">mouseY:</p>
            </aside>
            <footer id="bottomPanel">
                <button id="spawnAnimalBtn" class="simpleBtn">
                    Spawn Random Animal
                    <p>(Cost 30)</p>
                </button>
                <button id="spawn10RandomAnimalsBtn" class="simpleBtn">
                    Spawn 10 Random Animals
                    <p>(Cost 300)</p>
                </button>
                <button id="toggleGameStateBtn" class="simpleBtn">
                    Toggle Game State
                </button>
            </footer>
        </div>
    </body>
    <script type="module" src="scripts/main.js"></script>
</html>
